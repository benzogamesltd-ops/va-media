<!doctype html><html lang="de"><head><meta charset="utf-8"><link rel="stylesheet" href="common.css"><style>
.st{background:linear-gradient(180deg,#8CCBFF 0%,#CFE8FF 48%,#FFE4C2 100%)}
.sunglow{position:absolute;left:540px;top:400px;width:900px;height:900px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,193,94,.55) 0%,rgba(255,228,194,.25) 40%,transparent 70%)}
svg{position:absolute;left:0;top:0}
.brain{position:absolute;left:540px;top:400px;width:190px;height:190px;transform:translate(-50%,-50%);border-radius:50%;
 background:radial-gradient(circle at 40% 35%,#FFF7DE 0%,#FFC15E 45%,#F07A1A 100%);box-shadow:0 0 90px 30px rgba(240,122,26,.45),inset -16px -20px 40px rgba(160,60,0,.35);
 display:flex;align-items:center;justify-content:center;font-family:'Inter';font-weight:800;font-size:22px;letter-spacing:.18em;color:#3A1A00}
.card{position:absolute;transform:translate(-50%,-50%);padding:14px 20px;border-radius:18px;background:rgba(255,255,255,.62);border:1.5px solid rgba(255,255,255,.95);backdrop-filter:blur(12px);box-shadow:0 14px 40px rgba(47,91,234,.18);font-family:'Inter';font-weight:700;font-size:22px;color:#0F1B3D;white-space:nowrap}
.card small{display:block;font-size:14px;letter-spacing:.16em;color:#2F5BEA;margin-bottom:4px}
.card i{display:inline-block;width:10px;height:10px;border-radius:50%;background:#16A34A;margin-right:8px;box-shadow:0 0 8px #16A34A}
.tag{position:absolute;left:90px;top:96px;color:#2F5BEA;font-size:19px}
.h1{position:absolute;left:90px;top:760px;width:920px;color:#0F1B3D;font-weight:900;font-size:98px;line-height:1.0;letter-spacing:-.02em}
.h1 em{font-style:normal;color:#C2410C}
.sub{position:absolute;left:90px;top:1072px;width:900px;color:#1E2A55;font-family:'Inter';font-weight:600;font-size:34px;line-height:1.3}
.lock b{color:#0F1B3D}.lock span{color:#2F5BEA}
.sun{box-shadow:0 0 24px 6px rgba(240,122,26,.4)}
</style></head><body><div class="st" id="s">
<div class="blob" style="left:-160px;top:-120px;width:560px;height:520px;background:#FFFFFF;opacity:.6"></div>
<div class="blob" style="left:700px;top:900px;width:520px;height:420px;background:#FFC15E;opacity:.45"></div>
<div class="sunglow"></div>
<svg id="net" width="1080" height="800"></svg>
<div class="brain">AGENT</div>
<div class="card" style="left:220px;top:250px"><small>INBOX</small><i></i>E-Mails sortiert</div>
<div class="card" style="left:860px;top:230px"><small>REPORT</small><i></i>Bericht erstellt</div>
<div class="card" style="left:200px;top:590px"><small>CALENDAR</small><i></i>Termin geplant</div>
<div class="card" style="left:870px;top:600px"><small>DATA</small><i></i>Tabelle aktualisiert</div>
<div class="tag mono">AGENT_NETWORK · 24/7</div>
<div class="h1">Routine?<br>Übernimmt <em>dein<br>KI-Agent.</em></div>
<div class="sub">Wiederkehrende Aufgaben automatisieren —<br>damit dein Team Zeit für Ideen hat.</div>
<div class="lock"><div class="sun">VA</div><div><b>VA Corporation</b><span>AI AGENTS · GAMES · SOFTWARE</span></div></div>
</div><script>
let seed=77;const r=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
const svg=document.getElementById('net'),ns='http://www.w3.org/2000/svg',C=[540,400];const pts=[];
for(let i=0;i<46;i++){const a=r()*Math.PI*2,d=130+r()*420;pts.push([C[0]+Math.cos(a)*d*1.05,C[1]+Math.sin(a)*d*.62])}
const hubs=[[220,250],[860,230],[200,590],[870,600]];
function L(a,b,w,o,c){const l=document.createElementNS(ns,'line');l.setAttribute('x1',a[0]);l.setAttribute('y1',a[1]);l.setAttribute('x2',b[0]);l.setAttribute('y2',b[1]);l.setAttribute('stroke',c);l.setAttribute('stroke-width',w);l.setAttribute('stroke-opacity',o);svg.appendChild(l)}
pts.forEach((p,i)=>{pts.forEach((q,j)=>{if(j>i&&Math.hypot(p[0]-q[0],p[1]-q[1])<150)L(p,q,1.5,.35,'#2F5BEA')})});
pts.forEach(p=>{if(Math.hypot(p[0]-C[0],p[1]-C[1])<300)L(p,C,1.2,.25,'#F07A1A')});
hubs.forEach(h=>L(h,C,3,.7,'#F07A1A'));
pts.forEach(p=>{const c=document.createElementNS(ns,'circle');c.setAttribute('cx',p[0]);c.setAttribute('cy',p[1]);c.setAttribute('r',3+r()*5);c.setAttribute('fill',r()>.5?'#2F5BEA':'#FFC15E');c.setAttribute('opacity',.85);svg.appendChild(c)});
</script></body></html>
