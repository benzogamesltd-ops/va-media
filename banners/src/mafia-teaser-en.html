<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;overflow:hidden;font-family:Inter,Arial,sans-serif;color:#fff;position:relative;
background:radial-gradient(800px 600px at 50% 40%,#1A3C85 0%,#0A1638 55%,#040814 100%)}
.beam{position:absolute;left:50%;top:-150px;width:900px;height:1300px;margin-left:-450px;background:radial-gradient(ellipse at 50% 0%,rgba(190,225,255,.3),transparent 65%)}
h1{position:absolute;top:56px;left:0;right:0;text-align:center;font:900 94px/0.95 Montserrat,sans-serif;letter-spacing:-3px}
h1 em{font-style:normal;color:#FF4B3E}
.mug{position:absolute;left:50px;top:270px;width:560px;border:16px solid #F3EDE2;border-bottom-width:52px;transform:rotate(-4deg);box-shadow:0 30px 70px rgba(0,0,0,.6)}
.mug img{display:block;width:100%}
.right{position:absolute;left:650px;top:300px;width:400px}
.t1{font:900 104px/1 Montserrat,sans-serif;letter-spacing:-2px}.t2{display:inline-block;margin-top:8px;font:900 34px Montserrat,sans-serif;letter-spacing:14px;background:#D7261E;border-radius:30px;padding:6px 24px 6px 38px}
.when{font:800 30px Inter,sans-serif;color:#9FC7FF;letter-spacing:3px;margin-top:40px}
.date{font:900 76px/1 Montserrat,sans-serif;color:#FFC94D;margin-top:8px;text-shadow:0 0 30px rgba(255,201,77,.4)}
.line{font:700 34px/1.3 Inter,sans-serif;color:#E3EDFF;margin-top:30px}
.stamp{display:inline-block;margin-top:34px;font:900 36px Montserrat,sans-serif;letter-spacing:3px;color:#FFC94D;border:5px solid #FFC94D;border-radius:12px;padding:10px 22px;transform:rotate(-5deg)}
.lock{position:absolute;left:0;right:0;bottom:56px;display:flex;justify-content:center;align-items:center;gap:18px}
.sun{width:70px;height:70px;border-radius:50%;background:radial-gradient(circle at 38% 35%,#FFF7DE,#FFC15E 45%,#F07A1A);box-shadow:0 0 44px rgba(255,193,94,.7);display:flex;align-items:center;justify-content:center;font:900 26px Montserrat,sans-serif;color:#3B1D00}
.lock b{font:900 32px Montserrat,sans-serif;display:block}
.lock span{font:700 18px Inter,sans-serif;letter-spacing:2px;color:#9FC7FF}
.strip{position:absolute;left:0;right:0;top:1000px;height:220px;overflow:hidden;opacity:.9;-webkit-mask-image:linear-gradient(to bottom,transparent,#000 25%,#000 75%,transparent)}.strip img{width:1080px;margin-top:-90px}</style></head><body>
<div class="beam"></div><div class="strip"><img src="../../reels/src/assets/mafia/lineup_x.png"></div>
<h1>Who is the <em>MAFIA?</em></h1>
<div class="mug"><img src="../../reels/src/assets/mafia/mug_x.png"></div>
<div class="right">
 <div class="t1">MAFIA</div><div class="t2">ONLINE</div>
 <div class="when">OUR NEW GAME</div>
 <div class="date">JANUARY<br>2027</div>
 <div class="line">Cop. Doctor. Mafia.<br>Who is lying?</div>
 <div class="stamp">COMING SOON</div>
</div>
<div class="lock"><div class="sun notranslate">VA</div><div><b>VA Corporation</b><span>va-corporation.github.io</span></div></div>
</body></html>
