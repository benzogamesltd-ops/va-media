<!doctype html><html lang="de"><head><meta charset="utf-8"><link rel="stylesheet" href="common.css"><style>

 background:radial-gradient(circle at 34% 28%,#FFF7DE 0%,#FFE066 20%,#FF7A2F 50%,#6C4DFF 85%,#2A1C7A 100%);
 box-shadow:inset -50px -60px 100px rgba(30,15,90,.7),0 0 140px 40px rgba(255,224,102,.45)}
